repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

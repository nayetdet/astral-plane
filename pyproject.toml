[project]
name = "astral-plane"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=1.22",
  "orbslam3",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
orbslam3 = { url = "https://github.com/nayetdet/orbslam3-python/releases/download/v0.1.3/orbslam3-0.1.3-cp314-cp314-manylinux_2_35_x86_64.whl" }

[project]
name = "astral-plane"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.9,<3.15"
dependencies = [
  "numpy>=1.22",
  "orbslam3==0.1.21",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
orbslam3 = { index = "orbslam3" }

[[tool.uv.index]]
name = "orbslam3"
url = "https://github.com/nayetdet/orbslam3-python/releases/expanded_assets/v0.1.21"
format = "flat"
explicit = true

[project]
name = "astral-plane"
version = "0.1.0"
description = "Astral Plane is a real-time RGB-D visual SLAM application for the first-generation Microsoft Kinect. It captures color and registered depth frames with libfreenect, tracks the camera pose with ORB-SLAM3, and visualizes the results in a desktop interface."
readme = "README.md"
requires-python = ">=3.9,<3.15"
dependencies = [
  "numpy>=1.22",
  "orbslam3==0.1.22",
  "pydantic-settings>=2",
]

[dependency-groups]
dev = [
    "mypy<2",
    "pre-commit>=4",
    "ruff>=0.17.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D",
  "EM101",
  "EM102",
  "FBT003",
  "ISC001",
  "PYI034",
  "T201",
  "TC",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/astral_plane/bindings/orbslam.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["orbslam3", "pygame.*"]
ignore_missing_imports = true

[tool.uv.sources]
orbslam3 = { index = "orbslam3" }

[[tool.uv.index]]
name = "orbslam3"
url = "https://github.com/nayetdet/orbslam3-python/releases/expanded_assets/v0.1.22"
format = "flat"
explicit = true
